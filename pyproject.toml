[project]
name = "music-prod"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "basic-pitch>=0.4.0",
    "demucs>=4.0.1",
    "yt-dlp>=2025.12.8",
    "torchcodec",
    "music21>=9.9.1",
    "librosa>=0.11.0",
]

[project.scripts]
music-prod = "music_prod.transcribe_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]
