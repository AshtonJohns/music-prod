[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-prod"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "basic-pitch>=0.4.0",
    "demucs>=4.0.1",
    "yt-dlp>=2025.12.8",
    "torchcodec",
    "music21>=9.9.1",
    "librosa>=0.11.0",
    "watchdog>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9.0",
]

[project.scripts]
music-prod = "music_prod.transcribe_pipeline:main"
music-prod-cakewalk-setup = "music_prod.cakewalk_setup:main"
music-prod-sync-capture = "music_prod.sync_capture:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
package = true
